name: Смоук против живой биржи

# Принято из предложения зоны `deploy` (OPS-18, Р-077) с одной добавкой:
# адресат отказа. Р-092 — прогон, у которого нет названного читателя, не
# заводится вовсе: это тот же механизм, которым смоук умер в прошлый раз.
#
# ЗАЧЕМ ОТДЕЛЬНО. Здесь живут три проверки, которые зависят от Binance:
# правдоподобие цены, приход живого тика за 20 секунд, возраст последнего
# тика. Чужая сеть иногда не отвечает, и красное от неё — ложная тревога.
# После двух-трёх ложных тревог красный перестают открывать, и тогда мы
# теряем не этот прогон, а привычку смотреть на красное вообще.
#
# ПОЧЕМУ ОНО ВСЁ-ТАКИ БЛОКИРУЮЩЕЕ ВНУТРИ СЕБЯ. `continue-on-error` дал бы
# зелёный прогон с жёлтой пометкой, то есть напечатал бы «ok» о непройденной
# проверке. Здесь прогон краснеет честно — но ничью ветку не держит, потому
# что на пуш не повешен.
#
# ЧЕМ ЗАКРЫТ ОСТАТОЧНЫЙ РИСК. Прогон по расписанию никто не обязан
# открывать, и это ровно тот механизм, которым смоук умер в прошлый раз.
# Поэтому на отказе заводится issue в этом же репозитории — у красного
# появляется место, где он лежит и мозолит глаза. Issue переоткрывается не
# каждый день: если открытый уже есть, в него дописывается строка.
on:
  schedule:
    - cron: '17 6 * * *'        # ежедневно, время смещено от ровного часа
  workflow_dispatch:

concurrency:
  group: smoke-live
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  # ------------------------------------------------------------------
  # Сторож адресата. ОТДЕЛЬНАЯ работа, и это главное в ней.
  #
  # 25.10 выяснилось, что шаг «завести issue» не мог сработать никогда:
  # отчёты в репозитории выключены (`has_issues = false`). Хуже самого
  # факта оказалось то, как он выглядел: шаг падал ВНУТРИ прогона, который
  # и так красный, и его собственная смерть ничего видимого не добавляла.
  #
  #   Сторож, сломавшийся во время происшествия, неотличим от сторожа,
  #   который просто сообщил о происшествии.
  #
  # Отсюда правило штаба: механизм оповещения о красном не живёт шагом
  # внутри краснеющего прогона. Поэтому проверка адресата вынесена в
  # собственную работу — её красное **отдельное** и видно независимо от
  # того, что случилось со смоуком. И спрашиваем мы её тогда, когда всё
  # спокойно, а не в момент происшествия.
  #
  # Это тот же класс, что реестр источников: свойство, на которое
  # опирается решение, не охранялось ничем. Адресат был спроектирован
  # правильно и не проверен существованием.
  adresat:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Есть ли куда лечь отказу
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          enabled=$(gh api "repos/${{ github.repository }}" --jq '.has_issues')
          echo "has_issues = $enabled"
          {
            echo "## Адресат отказа"
            echo ""
            echo "\`has_issues\` = \`$enabled\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$enabled" != "true" ]; then
            echo "::error title=Адресату отказа некуда лечь::Отчёты в репозитории выключены (has_issues=false). Шаг «завести issue» в ночном смоуке не может сработать В ПРИНЦИПЕ: красный останется без места, где он мозолит глаза. Чинится одной галочкой в настройках репозитория — Settings → General → Features → Issues."
            {
              echo ""
              echo "**Отчёты выключены — оповещение о красном не работает.**"
              echo "Ночной смоук краснеет молча: issue завести некуда."
              echo "Чинится галочкой: Settings → General → Features → Issues."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  live:
    # Сторож адресата НЕ является условием запуска смоука: смоук обязан
    # идти и тогда, когда оповещение сломано, иначе отказ сторожа гасит
    # то, что он сторожит. Работы идут рядом, краснеют порознь.
    # Образ закреплён, а не `ubuntu-latest`. GitHub прислал в аннотации
    # прогона 20.10: «The ubuntu-latest label will migrate to Ubuntu 26
    # beginning October 19, 2026». Мы ровно в окне переезда — два
    # соседних пуша могли бы ехать на разных образах, и красное от смены
    # образа неотличимо от красного по делу. Возвращаться к `latest`:
    # когда переезд закончится (следить за actions/runner-images#14748).
    # Цена промедления: отстающий образ, то есть мелочь.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Поднять MDS против настоящего Binance
        run: |
          set -euo pipefail
          QUOTE_STALE_AFTER_MS=60000 \
          MDS_REGISTRY_PATH=/tmp/mds-live-registry.json \
          PORT=3003 \
          node dist/index.js > /tmp/mds.log 2>&1 & echo $! > /tmp/mds.pid
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3003/health || true)
            [ "$code" = "200" ] || [ "$code" = "503" ] && break
            sleep 1
          done
          # Печатаем ответ целиком: при отказе он и будет диагнозом. Разница
          # между «биржа не ответила» и «ответила не тем» чинится по-разному,
          # и схлопывать их в один «смоук упал» нельзя.
          echo "--- /health перед смоуком ---"
          curl -s http://127.0.0.1:3003/health | head -c 2000; echo

      # Секрет служебной ручки здесь НЕ НУЖЕН: живая половина про границу
      # ручки ничего не проверяет, эти проверки целиком в контрактной.
      - name: Смоук — живая половина
        id: smoke
        env:
          MDS_URL: http://127.0.0.1:3003
          MDS_SMOKE_MODE: live
        run: |
          set +e
          node scripts/smoke.mjs 2>&1 | tee /tmp/smoke-live.log
          code=${PIPESTATUS[0]}
          set -e
          # Код возврата берётся у node, а не у `tee`: `$?` после конвейера
          # принадлежит последней команде в нём. На этом уже обжигались.
          # Исходы РАЗВЕДЕНЫ (решение штаба 25.10). Недостижимость биржи —
          # невыполнение, а не расхождение, и заголовок отчёта у неё свой.
          # Зелёным оно не становится: «неизвестно» не равно «хорошо». Но и
          # равным настоящему расхождению быть не должно: у красного,
          # приходящего каждую ночь по чужой вине, не будет читателя на
          # третью ночь, и тогда теряются ОБА сигнала.
          case "$code" in
            0) echo "Живая половина пройдена." ;;
            1) echo "kind=rashozhdenie" >> "$GITHUB_OUTPUT"
               echo "РАСХОЖДЕНИЕ: биржа отвечает, но не тем." >&2; exit 1 ;;
            3) echo "kind=ne-vypolneno" >> "$GITHUB_OUTPUT"
               echo "НЕ ВЫПОЛНЕНО: источник недостижим, результат неизвестен." >&2; exit 1 ;;
            *) echo "kind=slomalsya" >> "$GITHUB_OUTPUT"
               echo "ПРОВАЛ: смоук завершился кодом $code — это не результат проверок." >&2; exit 1 ;;
          esac

      # Адресат отказа. Без него это снова проверка, которую можно не
      # посмотреть.
      - name: Завести issue на отказе
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Заголовок зависит от ИСХОДА, а не от факта красноты: два разных
          # отчёта вместо одного. Иначе «биржа молчала» и «биржа ответила
          # не тем» лежат в одной куче, и читать её перестанут по первой.
          case "${{ steps.smoke.outputs.kind }}" in
            ne-vypolneno)
              TITLE="Смоук против живой биржи НЕ ВЫПОЛНЕН: источник недостижим"
              HEAD1="Живые проверки не выполнялись — службе не пришло от биржи ничего:"
              HEAD2="ни каталога по HTTP, ни одного тика. Это НЕ расхождение и НЕ успех."
              HEAD3="Чинится не кодом. Если повторяется подряд — вопрос к сети раннера,"
              HEAD4="а не к MDS; если однократно — чужая сеть, и закрывать без правок." ;;
            rashozhdenie)
              TITLE="Смоук против живой биржи: РАСХОЖДЕНИЕ"
              HEAD1="Биржа отвечает, но не тем. Это находка в нашу сторону:"
              HEAD2="формат, поля или правдоподобие значений разошлись с ожидаемым."
              HEAD3="Читаем, ЧТО именно не сошлось, а не «смоук упал»."
              HEAD4="Недостижимостью сети это НЕ объясняется — данные пришли." ;;
            *)
              TITLE="Смоук против живой биржи СЛОМАЛСЯ до результата"
              HEAD1="Прогон завершился не кодом проверок — он упал раньше них."
              HEAD2="Это не результат о бирже и не результат о нас."
              HEAD3="Сначала чиним прогон, потом судим о том, что он проверял."
              HEAD4="" ;;
          esac
          BODY=$(printf '%s\n' \
            "Прогон: $RUN_URL" \
            "" \
            "$HEAD1" "$HEAD2" "$HEAD3" "$HEAD4" \
            "" \
            '```' \
            "$(tail -c 3000 /tmp/smoke-live.log 2>/dev/null || echo 'лога нет — прогон упал до смоука')" \
            '```')
          # Доставка отказа может не состояться, и тогда об этом надо
          # КРИЧАТЬ ГРОМЧЕ, чем о самом отказе: отчёт, не доехавший до
          # адресата, — недоставка, а не доставка с замечанием. Молчаливая
          # смерть этого шага внутри и так красного прогона неотличима от
          # его успешной работы — на этом мы уже обожглись 25.10.
          #
          # Сводка прогона (`$GITHUB_STEP_SUMMARY`) и аннотация `::error::`
          # видны на странице прогона независимо от его цвета, поэтому
          # остаток отказа ложится туда — хоть куда-то, где его увидят.
          delivered=no
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            if gh issue comment "$EXISTING" --body "$BODY"; then
              delivered=yes
              echo "Дописано в открытый issue #$EXISTING — новый не заводим, иначе их перестанут читать."
            fi
          else
            if gh issue create --title "$TITLE" --body "$BODY" --label "смоук-живой" 2>/dev/null \
               || gh issue create --title "$TITLE" --body "$BODY"; then
              delivered=yes
            fi
          fi

          if [ "$delivered" != "yes" ]; then
            echo "::error title=Отказ НЕ ДОСТАВЛЕН адресату::Issue завести не удалось — вероятнее всего отчёты в репозитории выключены. Красный остался без места, где он мозолит глаза. Текст отказа — в сводке прогона ниже."
          fi
          {
            echo "## $TITLE"
            echo ""
            echo "Доставлено в issue: **$delivered**"
            echo ""
            echo '```'
            tail -c 3000 /tmp/smoke-live.log 2>/dev/null || echo 'лога нет — прогон упал до смоука'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Вывод MDS уведён в файл не ради тишины: фоновый процесс, держащий
      # stdout шага, не даёт шагу завершиться. Диагностику печатаем здесь —
      # ошибку не глушат, её показывают.
      - name: Лог поднятого
        if: always()
        run: |
          echo "===== /tmp/mds.log ====="
          tail -c 4000 /tmp/mds.log 2>/dev/null || echo "(файла нет)"

      - name: Снять поднятое
        if: always()
        run: |
          [ -f /tmp/mds.pid ] && kill "$(cat /tmp/mds.pid)" 2>/dev/null || true
          wait 2>/dev/null || true
